<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Капитану Маше 🏴‍☠️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Marck+Script&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; min-height: 100vh; min-height: 100dvh; overflow: hidden; background: #040818; }
  body { font-family: "Caveat", "Comic Sans MS", cursive; color: #fff; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; z-index: 0; }

  .scene {
    position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 18px; opacity: 0; pointer-events: none; transition: opacity 1.1s ease;
  }
  .scene.on { opacity: 1; pointer-events: auto; }
  .title { font-family: "Marck Script", cursive; }

  /* ---------- 1. бутылка ---------- */
  #s1 { justify-content: flex-start; padding-top: 16vh; pointer-events: none !important; text-align: center; }
  #s1 .title { font-size: clamp(32px, 9vw, 52px); text-shadow: 0 0 18px rgba(160,190,255,.7); }
  #s1 p { margin-top: 10px; font-size: 22px; opacity: .75; animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .9; } }

  /* ---------- 2. письмо ---------- */
  .scroll { width: min(92vw, 430px); display: flex; flex-direction: column; align-items: center; filter: drop-shadow(0 12px 30px rgba(0,0,0,.5)); }
  .roller { width: 104%; height: 26px; border-radius: 13px; background: linear-gradient(#c9945a, #8a5a2b 55%, #5e3a17); box-shadow: inset 0 3px 4px rgba(255,255,255,.25); z-index: 1; }
  .paper {
    width: 100%; max-height: 0; overflow: hidden; margin: -6px 0;
    background: radial-gradient(ellipse at center, #fbefd2 40%, #ecd49f 85%, #d8b674);
    transition: max-height 1.8s cubic-bezier(.6,0,.2,1);
  }
  .scroll.open .paper { max-height: calc(100dvh - 210px); max-height: calc(100vh - 210px); overflow-y: auto; }
  #letter { padding: 22px 24px 18px; color: #3b2414; font-size: clamp(20px, 5.6vw, 25px); line-height: 1.22; }
  #letter p { margin-bottom: 12px; opacity: 0; transform: translateY(10px); filter: blur(4px); transition: opacity 1s ease, transform 1s ease, filter 1s ease; }
  #letter p.on { opacity: 1; transform: none; filter: none; }
  #letter p:first-child { font-family: "Marck Script", cursive; font-size: 1.35em; color: #7a1d1d; }
  #letter .sign { text-align: right; font-weight: 700; }

  .btn {
    margin-top: 16px; padding: 12px 28px; border: none; border-radius: 30px; cursor: pointer;
    font-family: "Marck Script", cursive; font-size: 23px; color: #3b2414;
    background: linear-gradient(#ffe29a, #e6a23c); box-shadow: 0 6px 18px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.6);
    opacity: 0; transform: translateY(10px) scale(.95); transition: opacity .8s ease, transform .8s cubic-bezier(.2,1.5,.4,1);
    pointer-events: none;
  }
  .btn.show { opacity: 1; transform: none; pointer-events: auto; }
  .btn:active { transform: scale(.94); }

  /* ---------- 3. карта ---------- */
  .map-wrap {
    width: min(92vw, 420px, calc((100dvh - 250px) / 1.444)); aspect-ratio: 360 / 520; position: relative;
    background: radial-gradient(ellipse at 50% 45%, #f7e7c0 35%, #e7cb8f 75%, #c99e5c 100%);
    border-radius: 10px; box-shadow: 0 14px 40px rgba(0,0,0,.5), inset 0 0 40px rgba(110,70,20,.45);
    transform: rotate(-1deg) scale(.9); opacity: 0; transition: transform 1.2s cubic-bezier(.2,1.3,.4,1), opacity 1s ease;
  }
  #s3.on .map-wrap { transform: rotate(-1deg) scale(1); opacity: 1; }
  .map-wrap svg { width: 100%; height: 100%; display: block; }
  .map-title { position: absolute; top: 8px; left: 0; right: 0; text-align: center; font-family: "Marck Script", cursive; font-size: 22px; color: #6b3b17; pointer-events: none; }

  .card {
    width: min(92vw, 420px); margin-top: 14px; padding: 12px 16px; min-height: 96px; border-radius: 14px;
    background: rgba(255, 248, 232, .95); color: #3b2414; box-shadow: 0 8px 24px rgba(0,0,0,.35);
    transition: opacity .45s ease, transform .45s ease;
  }
  .card.hide { opacity: 0; transform: translateY(8px); }
  .card h3 { font-family: "Marck Script", cursive; font-weight: normal; font-size: 24px; color: #7a1d1d; }
  .card p { font-size: 21px; line-height: 1.2; margin-top: 2px; }
  #s3 .btn { margin-top: 12px; }

  /* ---------- 4. сундук ---------- */
  #s4 { text-align: center; }
  #s4 .hint { font-size: 24px; margin-bottom: 8px; text-shadow: 0 2px 8px rgba(0,0,0,.6); transition: opacity .6s; }
  .stage { position: relative; width: 260px; height: 230px; display: flex; align-items: flex-end; justify-content: center; }
  .rays {
    position: absolute; left: 50%; top: 55%; width: 560px; height: 560px; margin: -280px 0 0 -280px; border-radius: 50%;
    background: repeating-conic-gradient(rgba(255,220,120,.55) 0 7deg, rgba(255,220,120,0) 7deg 20deg);
    -webkit-mask: radial-gradient(circle, #000 15%, transparent 65%); mask: radial-gradient(circle, #000 15%, transparent 65%);
    opacity: 0; transform: scale(.4); transition: opacity 1.4s ease, transform 1.6s ease; animation: spin 18s linear infinite;
  }
  @keyframes spin { to { rotate: 360deg; } }
  .chest { position: relative; width: 180px; height: 145px; cursor: pointer; animation: wiggle 2.4s ease-in-out infinite; }
  .chest .box {
    position: absolute; bottom: 0; left: 0; right: 0; height: 92px; border-radius: 6px 6px 12px 12px;
    background: linear-gradient(#93602f, #5b3815); border: 4px solid #3a220c; box-shadow: inset 0 -10px 18px rgba(0,0,0,.35);
  }
  .chest .band { position: absolute; top: -4px; bottom: -4px; width: 16px; background: linear-gradient(90deg, #b8861f, #ffd66b, #b8861f); }
  .chest .lock { position: absolute; left: 50%; top: 6px; width: 26px; height: 30px; margin-left: -13px; border-radius: 5px; background: linear-gradient(#ffe48a, #c99319); border: 2px solid #6e4b0b; }
  .chest .glow {
    position: absolute; left: 10px; right: 10px; top: 42px; height: 30px; border-radius: 50%;
    background: radial-gradient(ellipse, #fff6c8, #ffcf4a 45%, rgba(255,200,60,0) 75%); opacity: 0; transition: opacity .8s .3s;
  }
  .chest .lid {
    position: absolute; top: 0; left: 0; right: 0; height: 60px; border-radius: 90px 90px 6px 6px / 56px 56px 6px 6px;
    background: linear-gradient(#a8703b, #6b431c); border: 4px solid #3a220c; transform-origin: 8% 100%;
    transition: transform 1.1s cubic-bezier(.3,1.6,.5,1);
  }
  .chest .lid .band { top: -4px; bottom: -4px; border-radius: 8px 8px 0 0; }
  .chest.open { animation: none; }
  .chest.open .lid { transform: rotate(-38deg) translate(-6px, -14px); }
  .chest.open .glow { opacity: 1; }
  #s4.opened .rays { opacity: 1; transform: scale(1); }
  @keyframes wiggle { 0%,80%,100% { transform: rotate(0); } 84% { transform: rotate(-3deg); } 88% { transform: rotate(3deg); } 92% { transform: rotate(-2deg); } 96% { transform: rotate(1deg); } }

  .reveal { opacity: 0; transform: translateY(12px); filter: blur(6px); transition: opacity 1.1s ease, transform 1.1s ease, filter 1.1s ease; }
  .reveal.on { opacity: 1; transform: none; filter: none; }
  #treasureText { margin-top: 26px; font-family: "Marck Script", cursive; font-size: clamp(28px, 8vw, 40px); color: #ffe7a3; text-shadow: 0 0 16px rgba(255,190,80,.8), 0 2px 6px rgba(0,0,0,.6); padding: 0 10px; }
  #question { margin-top: 14px; font-size: clamp(22px, 6vw, 28px); text-shadow: 0 2px 8px rgba(0,0,0,.7); padding: 0 14px; }
  .answers { margin-top: 18px; display: flex; gap: 14px; justify-content: center; }
  .answers .btn { margin-top: 0; }
  #no { background: linear-gradient(#e9e2d6, #b9ad98); position: relative; transition: opacity .8s ease, transform .8s cubic-bezier(.2,1.5,.4,1), left .35s ease, top .35s ease; }

  /* ---------- 5. финал ---------- */
  #s5 { justify-content: flex-start; padding-top: 11vh; text-align: center; pointer-events: none !important; }
  #s5 h1 { font-family: "Marck Script", cursive; font-weight: normal; font-size: clamp(44px, 13vw, 76px); color: #fff3d0; text-shadow: 0 0 20px rgba(255,140,80,.9), 0 3px 8px rgba(0,0,0,.4); }
  #s5 p { margin-top: 8px; font-size: clamp(22px, 6.2vw, 30px); line-height: 1.2; text-shadow: 0 2px 8px rgba(60,10,40,.8); }

  .coin { position: fixed; z-index: 3; font-size: 26px; pointer-events: none; will-change: transform; }
</style>
</head>
<body>
<canvas id="sea"></canvas>

<!-- 1 -->
<div class="scene on" id="s1">
  <div class="title" id="s1title"></div>
  <p>нажми на бутылку в волнах</p>
</div>

<!-- 2 -->
<div class="scene" id="s2">
  <div class="scroll" id="scroll">
    <div class="roller"></div>
    <div class="paper"><div id="letter"></div></div>
    <div class="roller"></div>
  </div>
  <button class="btn" id="toMap">Открыть карту 🗺</button>
</div>

<!-- 3 -->
<div class="scene" id="s3">
  <div class="map-wrap">
    <div class="map-title">Карта нашего побега</div>
    <svg id="map" viewBox="0 0 360 520"></svg>
  </div>
  <div class="card" id="card"><h3></h3><p></p></div>
  <button class="btn" id="next">Плывём дальше ⛵</button>
</div>

<!-- 4 -->
<div class="scene" id="s4">
  <div class="hint" id="chestHint">Сокровище здесь. Открывай ⛏</div>
  <div class="stage">
    <div class="rays"></div>
    <div class="chest" id="chest">
      <div class="glow"></div>
      <div class="box"><div class="band" style="left:22px"></div><div class="band" style="right:22px"></div></div>
      <div class="lid"><div class="band" style="left:22px"></div><div class="band" style="right:22px"></div><div class="lock"></div></div>
    </div>
  </div>
  <div class="reveal" id="treasureText"></div>
  <div class="reveal" id="question"></div>
  <div class="answers">
    <button class="btn" id="yes">Да, на борт ⚓</button>
    <button class="btn" id="no">Нет</button>
  </div>
</div>

<!-- 5 -->
<div class="scene" id="s5">
  <h1 class="reveal" id="finalTitle">Полный вперёд! 🏴‍☠️</h1>
  <p class="reveal" id="finalText"></p>
</div>

<script>
/* ================== ТЕКСТЫ (можно менять) ================== */
const NAME = "Маша";
const SIGN = "Твой механик ⚙️";

const LETTER = [
  `${NAME}, ахой! 🏴‍☠️`,
  "Ты в детстве мечтала стать пиратом, а я — машинистом. Кажется, вселенная уже тогда собирала нам экипаж: капитан и механик.",
  "Я построю яхту. Ты проложишь курс. И мы уйдём туда, где нас никто не найдёт.",
  "Будем ловить рыбу, драить палубу (по очереди, честно-честно), пить ром на закате и просыпаться у необитаемого острова.",
  "Я даже карту нарисовал. Держи ⤵",
  SIGN
];

const STOPS = [
  { x: 62,  y: 462, name: "Бухта Отплытия",     icon: "⚓", text: "Здесь мы поднимаем якорь. Механик проверил мотор, капитан проверила, что механика не забыли на берегу 😌" },
  { x: 258, y: 398, name: "Остров Рыбалки",     icon: "🎣", text: "Ты ловишь рыбу. Я делаю вид, что так и задумано, когда твоя больше моей." },
  { x: 104, y: 300, name: "Ромовый риф",        icon: "🥥", text: "Тост за самую красивую пиратку всех семи морей. Йо-хо-хо 🥃" },
  { x: 268, y: 214, name: "Бухта Чистой Палубы", icon: "🧽", text: "Драим палубу по очереди. Почему-то каждая очередь выпадает на меня. И я не против." },
  { x: 86,  y: 136, name: "Необитаемый остров", icon: "🌴", text: "Просыпаешься — а перед тобой необитаемый остров. И я с кофе ☕" },
  { x: 262, y: 62,  name: "Край света",         icon: "",   text: "Говорят, здесь зарыто самое главное сокровище. Проверим?" }
];

const TREASURE = "Главное сокровище, которое я нашёл — это ты 💛";
const QUESTION = `Капитан ${NAME}, возьмёшь меня механиком в свою команду?`;
const FINAL = `Капитан ${NAME} и её верный механик.<br>Курс — куда подальше. Вместе ❤️`;
const NO_TEXTS = ["Точно?", "Подумай ещё 🥺", "Не поймаешь 😜", "Механик обидится", "Кнопка сломана 🔧", "Только «Да»!"];

/* ================== ХОЛСТ: МОРЕ ================== */
const cv = document.getElementById('sea');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SC = 1, HOR = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  const w = Math.round(r.width) || innerWidth, h = Math.round(r.height) || innerHeight;
  if (w === W && h === H) return;
  W = w; H = h;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SC = Math.max(.8, Math.min(1.6, W / 400));
  HOR = H * .62;
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 300));
if (window.visualViewport) visualViewport.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(document.documentElement);
setInterval(resize, 500);

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

// палитры неба
const PAL = {
  night:  { top: '#040818', mid: '#0c1a3e', hor: '#2a3a6e', sea: ['#1a2a55', '#122046', '#0c1735', '#071026'], sun: '#fff3d6', glow: '#8ea6ff', sx: .76, sy: .2, sr: .045, stars: 1, shine: '#cdd8ff' },
  dawn:   { top: '#2a3170', mid: '#d77a8f', hor: '#ffc49a', sea: ['#5d6ca8', '#43568f', '#31427a', '#213264'], sun: '#fff0c4', glow: '#ffae88', sx: .3,  sy: .57, sr: .07,  stars: .15, shine: '#ffe2c4' },
  sunset: { top: '#2d1550', mid: '#e2586f', hor: '#ffcf73', sea: ['#8d4c79', '#693b6f', '#4c2c5f', '#331d4b'], sun: '#ffe38a', glow: '#ff8a4c', sx: .5,  sy: .56, sr: .1,   stars: 0,   shine: '#ffd68a' }
};
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',')})`; };
const mixn = (a, b, k) => a + (b - a) * k;
let palFrom = PAL.night, palTo = PAL.night, palK = 1, palT0 = 0;
function cur() {
  const k = ease(palK), a = palFrom, b = palTo;
  return {
    top: mix(a.top, b.top, k), mid: mix(a.mid, b.mid, k), hor: mix(a.hor, b.hor, k),
    sea: a.sea.map((c, i) => mix(c, b.sea[i], k)), sun: mix(a.sun, b.sun, k), glow: mix(a.glow, b.glow, k),
    sx: mixn(a.sx, b.sx, k), sy: mixn(a.sy, b.sy, k), sr: mixn(a.sr, b.sr, k), stars: mixn(a.stars, b.stars, k), shine: mix(a.shine, b.shine, k)
  };
}
// mix() принимает hex; для повторного смешивания переводим rgb() обратно в hex
function toHex(c) { if (c[0] === '#') return c; const m = c.match(/\d+/g).map(Number); return '#' + m.map(v => v.toString(16).padStart(2, '0')).join(''); }
function snapshot() { const c = cur(); return { ...c, top: toHex(c.top), mid: toHex(c.mid), hor: toHex(c.hor), sea: c.sea.map(toHex), sun: toHex(c.sun), glow: toHex(c.glow), shine: toHex(c.shine) }; }
function setSkySafe(p) { palFrom = snapshot(); palTo = PAL[p]; palK = 0; palT0 = performance.now(); }

const stars = Array.from({ length: 130 }, () => ({ x: Math.random(), y: Math.random() * .6, z: Math.random(), p: rnd(0, 6.28), s: rnd(.5, 1.8) }));
const birds = Array.from({ length: 4 }, (_, i) => ({ x: rnd(0, 1), y: rnd(.12, .4), s: rnd(.7, 1.2), v: rnd(.012, .025), p: rnd(0, 6.28) }));

function waveY(i, x, T) {
  const b = HOR + (H - HOR) * [.03, .22, .48, .76][i];
  const A = [2.5, 6, 10, 15][i] * SC;
  return b + A * Math.sin(x * .012 / SC + T * (.55 + i * .22) + i * 1.7) + A * .45 * Math.sin(x * .029 / SC - T * (.9 + i * .18) + i);
}
function drawWave(i, T, color) {
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 8; x += 8) ctx.lineTo(x, waveY(i, x, T));
  ctx.lineTo(W, H); ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  ctx.beginPath();
  for (let x = 0; x <= W + 8; x += 8) { const y = waveY(i, x, T); x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.strokeStyle = `rgba(255,255,255,${.07 + i * .035})`; ctx.lineWidth = 1.5; ctx.stroke();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function heartPath(s) {
  ctx.beginPath(); ctx.moveTo(0, s * .3);
  ctx.bezierCurveTo(0, 0, -s * .5, 0, -s * .5, s * .3);
  ctx.bezierCurveTo(-s * .5, s * .6, 0, s * .78, 0, s);
  ctx.bezierCurveTo(0, s * .78, s * .5, s * .6, s * .5, s * .3);
  ctx.bezierCurveTo(s * .5, 0, 0, 0, 0, s * .3);
}

// бутылка
let bottleA = 1, bottleX = 0, bottleY = 0;
function drawBottle(T) {
  if (bottleA <= 0) return;
  const x = W * .5 + Math.sin(T * .35) * W * .06;
  const y = waveY(2, x, T) + 3;
  const slope = (waveY(2, x + 5, T) - waveY(2, x - 5, T)) / 10;
  bottleX = x; bottleY = y;
  const s = 1.15 * SC;
  // свечение-приглашение
  const pulse = .5 + .5 * Math.sin(T * 2.4);
  const g = ctx.createRadialGradient(x, y - 6, 0, x, y - 6, 70 * s);
  g.addColorStop(0, `rgba(255,240,190,${(.25 + pulse * .25) * bottleA})`); g.addColorStop(1, 'rgba(255,240,190,0)');
  ctx.fillStyle = g; ctx.fillRect(x - 80 * s, y - 86 * s, 160 * s, 160 * s);

  ctx.save();
  ctx.globalAlpha = bottleA;
  ctx.translate(x, y - 6 * s); ctx.rotate(Math.atan(slope) * .8 + Math.sin(T * 1.3) * .12); ctx.scale(s, s);
  // бумага внутри
  ctx.fillStyle = '#f3e2b8'; rr(-24, -8, 34, 16, 4); ctx.fill();
  ctx.fillStyle = '#b3262a'; ctx.fillRect(-8, -8, 3, 16);
  // стекло
  ctx.fillStyle = 'rgba(120,205,175,.45)'; ctx.strokeStyle = 'rgba(220,255,240,.8)'; ctx.lineWidth = 1.5;
  rr(-30, -14, 46, 28, 11); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(15, -11); ctx.quadraticCurveTo(25, -5, 27, -5); ctx.lineTo(38, -5); ctx.lineTo(38, 5); ctx.lineTo(27, 5); ctx.quadraticCurveTo(25, 5, 15, 11); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#b07a45'; rr(37, -5, 9, 10, 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-22, -9); ctx.lineTo(6, -9); ctx.stroke();
  ctx.restore();
}

// яхта
let yachtOn = false, yachtT0 = 0;
function drawYacht(T) {
  if (!yachtOn) return;
  const k = clamp((performance.now() - yachtT0) / 18000, 0, 1);
  const x = W * (.05 + ease(k) * .5);
  const y = waveY(1, x, T) + 4;
  const slope = (waveY(1, x + 8, T) - waveY(1, x - 8, T)) / 16;
  const s = .9 * SC * (H > 700 ? 1.1 : 1);
  ctx.save();
  ctx.translate(x, y); ctx.rotate(Math.atan(slope) * .9); ctx.scale(s, s);
  // корпус
  ctx.fillStyle = '#f5efe6';
  ctx.beginPath(); ctx.moveTo(-58, -6); ctx.lineTo(62, -6); ctx.lineTo(46, 14); ctx.lineTo(-48, 14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#7a1d2a'; ctx.fillRect(-52, 4, 104, 4);
  ctx.fillStyle = '#3a2a40'; [-30, -12, 6, 24].forEach(cx => { ctx.beginPath(); ctx.arc(cx, -1, 2.4, 0, 7); ctx.fill(); });
  // мачта
  ctx.strokeStyle = '#4a3020'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(0, -122); ctx.stroke();
  // паруса
  const bil = Math.sin(T * 1.6) * 3;
  ctx.fillStyle = '#fffaf0';
  ctx.beginPath(); ctx.moveTo(3, -116); ctx.quadraticCurveTo(30 + bil, -60, 50, -12); ctx.lineTo(3, -12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffe9d6';
  ctx.beginPath(); ctx.moveTo(-3, -108); ctx.quadraticCurveTo(-22 - bil, -60, -46, -12); ctx.lineTo(-3, -12); ctx.closePath(); ctx.fill();
  // пиратский флаг
  const fw = Math.sin(T * 5) * 2;
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.moveTo(0, -122); ctx.lineTo(24, -120 + fw); ctx.lineTo(24, -106 + fw); ctx.lineTo(0, -108); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(12, -115 + fw * .5, 3, 0, 7); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(7, -112 + fw * .5); ctx.lineTo(17, -109 + fw * .5); ctx.moveTo(17, -112 + fw * .5); ctx.lineTo(7, -109 + fw * .5); ctx.stroke();
  // сердечко на парусе
  ctx.save(); ctx.translate(22, -58); ctx.fillStyle = '#e2586f'; heartPath(14); ctx.fill(); ctx.restore();
  ctx.restore();
}

// частицы финала
const sparks = [], hearts = [];
function burst(x, y, n = 50) {
  const hue = [40, 340, 20, 300][(Math.random() * 4) | 0];
  for (let i = 0; i < n; i++) { const a = rnd(0, 6.28), v = rnd(40, 190); sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, d: rnd(.45, .9), hue: hue + rnd(-15, 15) }); }
}
function addHeart(x, y, fast) {
  hearts.push({ x, y, s: rnd(10, 20), vy: fast ? -rnd(70, 140) : -rnd(25, 45), vx: fast ? rnd(-60, 60) : 0, sw: rnd(0, 6.28), life: 0, max: fast ? 2.4 : rnd(8, 11), hue: rnd(330, 360) });
}

let T = 0, last = performance.now(), finalOn = false, finAcc = 0, heartAcc = 0;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now; T += dt;
  if (!W) resize();
  if (palK < 1) palK = clamp((now - palT0) / 3000, 0, 1);
  const P = cur();

  // небо
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const sky = ctx.createLinearGradient(0, 0, 0, HOR);
  sky.addColorStop(0, P.top); sky.addColorStop(.6, P.mid); sky.addColorStop(1, P.hor);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, HOR + 2);

  // звёзды
  if (P.stars > .01) {
    for (const s of stars) {
      s.p += dt * s.s;
      ctx.globalAlpha = P.stars * (.25 + .75 * (.5 + .5 * Math.sin(s.p))) * (.4 + s.z * .6);
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x * W, s.y * HOR, .6 + s.z * 1.2, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // солнце / луна
  const sx = W * P.sx, sy = H * P.sy, sr = Math.min(W, H) * P.sr;
  const gl = ctx.createRadialGradient(sx, sy, sr * .4, sx, sy, sr * 6);
  gl.addColorStop(0, P.glow.replace('rgb', 'rgba').replace(')', ',.55)')); gl.addColorStop(1, P.glow.replace('rgb', 'rgba').replace(')', ',0)'));
  ctx.fillStyle = gl; ctx.fillRect(0, 0, W, HOR + 2);
  ctx.fillStyle = P.sun; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fill();

  // чайки
  if (P.stars < .5) {
    ctx.strokeStyle = 'rgba(40,20,50,.65)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    for (const b of birds) {
      b.x += b.v * dt; if (b.x > 1.1) { b.x = -.1; b.y = rnd(.12, .4); }
      const f = Math.sin(T * 6 + b.p) * 4 * b.s, bx = b.x * W, by = b.y * HOR, w = 9 * b.s * SC;
      ctx.globalAlpha = 1 - P.stars * 2;
      ctx.beginPath(); ctx.moveTo(bx - w, by - f); ctx.quadraticCurveTo(bx - w * .4, by - w * .5, bx, by); ctx.quadraticCurveTo(bx + w * .4, by - w * .5, bx + w, by - f); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // море
  drawWave(0, T, P.sea[0]);
  // дорожка света на воде
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 26; i++) {
    const yy = HOR + (H - HOR) * (i / 26) + 4;
    const spread = sr * (.8 + (i / 26) * 3.5);
    const fl = .5 + .5 * Math.sin(T * 3 + i * 1.7);
    ctx.globalAlpha = (.08 + fl * .14) * (1 - i / 30);
    ctx.fillStyle = P.shine;
    ctx.beginPath(); ctx.ellipse(sx + Math.sin(T + i) * spread * .3, yy, spread * (.3 + fl * .5), 1.5 + i * .08, 0, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  drawWave(1, T, P.sea[1]);
  drawYacht(T);
  drawBottle(T);
  drawWave(2, T, P.sea[2]);
  drawWave(3, T, P.sea[3]);

  // финальные эффекты
  if (finalOn) {
    finAcc += dt; heartAcc += dt;
    if (finAcc > 1.6) { finAcc = 0; burst(rnd(W * .15, W * .85), rnd(H * .12, H * .38), 55); }
    if (heartAcc > .3) { heartAcc = 0; addHeart(rnd(0, W), H + 20, false); }
  }
  ctx.globalCompositeOperation = 'lighter';
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.vx *= Math.pow(.3, dt); p.vy = p.vy * Math.pow(.3, dt) + 70 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= p.d * dt;
    if (p.life <= 0) { sparks.splice(i, 1); continue; }
    ctx.globalAlpha = p.life; ctx.fillStyle = `hsl(${p.hue},100%,70%)`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 1 + 2.2 * p.life, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i];
    h.life += dt; h.sw += dt * 1.4; h.vx *= Math.pow(.3, dt);
    h.x += (h.vx + Math.sin(h.sw) * 20) * dt; h.y += h.vy * dt;
    const a = clamp(h.life / .7, 0, 1) * clamp((h.max - h.life) / 1.2, 0, 1);
    if (h.life > h.max || h.y < -40) { hearts.splice(i, 1); continue; }
    ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(Math.sin(h.sw) * .25);
    ctx.globalAlpha = a * .9; ctx.fillStyle = `hsl(${h.hue},90%,66%)`; heartPath(h.s); ctx.fill(); ctx.restore();
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================== СЦЕНЫ ================== */
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
let scene = 1;
function show(n) {
  document.querySelectorAll('.scene').forEach(s => s.classList.remove('on'));
  setTimeout(() => $('s' + n).classList.add('on'), 500);
}
$('s1title').textContent = `Капитан ${NAME}, вам послание 🌊`;

// 1 → 2: бутылка
async function openBottle() {
  if (scene !== 1) return;
  scene = 2;
  const t0 = performance.now();
  (function fade() { bottleA = 1 - clamp((performance.now() - t0) / 800, 0, 1); if (bottleA > 0) requestAnimationFrame(fade); })();
  show(2);
  await wait(900);
  $('scroll').classList.add('open');
  const L = $('letter');
  L.innerHTML = LETTER.map((t, i) => `<p${i === LETTER.length - 1 ? ' class="sign"' : ''}>${t}</p>`).join('');
  await wait(900);
  for (const p of L.children) { p.classList.add('on'); await wait(500 + p.textContent.length * 22); }
  $('toMap').classList.add('show');
}
cv.addEventListener('pointerdown', e => {
  if (scene === 1) openBottle();
  if (finalOn) { burst(e.clientX, e.clientY, 40); for (let i = 0; i < 5; i++) addHeart(e.clientX, e.clientY, true); }
});
$('s1').addEventListener('click', openBottle);

// 2 → 3: карта
const NS = 'http://www.w3.org/2000/svg';
const svg = $('map');
function el(tag, attrs, parent = svg) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
function smoothPath(pts) {
  let d = `M${pts[0].x},${pts[0].y}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C${c1x},${c1y} ${c2x},${c2y} ${p2.x},${p2.y}`;
  }
  return d;
}
function blob(cx, cy, r, seed) {
  const n = 9, pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, k = .75 + .4 * Math.abs(Math.sin(seed * 12.9 + i * 7.3)); pts.push([cx + Math.cos(a) * r * k * 1.15, cy + Math.sin(a) * r * k * .85]); }
  let d = '';
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n], m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    d += i ? ` Q${a[0]},${a[1]} ${m[0]},${m[1]}` : `M${(pts[n - 1][0] + a[0]) / 2},${(pts[n - 1][1] + a[1]) / 2} Q${a[0]},${a[1]} ${m[0]},${m[1]}`;
  }
  return d + 'Z';
}
let routeLen = [], routeTotal = 0, maskPath, ship, revealed = 0, stopIdx = 0, moving = false;
function buildMap() {
  svg.innerHTML = '';
  const d = smoothPath(STOPS);
  const defs = el('defs', {});
  const mask = el('mask', { id: 'reveal', maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: 360, height: 520 }, defs);
  maskPath = el('path', { d, stroke: '#fff', 'stroke-width': 12, fill: 'none', 'stroke-linecap': 'round' }, mask);

  // волны-завитки
  for (let i = 0; i < 16; i++) {
    const x = (i * 97) % 330 + 15, y = (i * 61) % 470 + 30;
    el('path', { d: `M${x},${y} q6,-6 12,0 t12,0`, stroke: 'rgba(110,70,30,.35)', 'stroke-width': 1.5, fill: 'none' });
  }
  // роза ветров
  const cx = 312, cy = 470;
  el('circle', { cx, cy, r: 22, fill: 'none', stroke: 'rgba(110,70,30,.55)', 'stroke-width': 1.5 });
  el('path', { d: `M${cx},${cy - 28} L${cx + 5},${cy} L${cx},${cy + 28} L${cx - 5},${cy}Z M${cx - 28},${cy} L${cx},${cy - 5} L${cx + 28},${cy} L${cx},${cy + 5}Z`, fill: 'rgba(122,29,29,.7)' });
  el('text', { x: cx, y: cy - 32, 'text-anchor': 'middle', 'font-size': 13, fill: '#6b3b17', 'font-family': 'Caveat' }).textContent = 'N';
  // морские жители
  el('text', { x: 28, y: 236, 'font-size': 26 }).textContent = '🐙';
  el('text', { x: 170, y: 505, 'font-size': 24 }).textContent = '🐳';
  el('text', { x: 318, y: 312, 'font-size': 20 }).textContent = '🦈';

  // маршрут
  el('path', { d, stroke: '#8b1e1e', 'stroke-width': 3.2, fill: 'none', 'stroke-dasharray': '1.5 9', 'stroke-linecap': 'round', mask: 'url(#reveal)' });

  // острова
  STOPS.forEach((s, i) => {
    el('path', { d: blob(s.x, s.y, 25, i + 1), fill: '#ead39f', stroke: '#a77c43', 'stroke-width': 2 });
    if (s.icon) el('path', { d: blob(s.x, s.y - 2, 14, i + 7), fill: '#8fae5d', opacity: .8 });
    if (s.icon) el('text', { x: s.x, y: s.y + 1, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 17 }).textContent = s.icon;
    else {
      el('path', { d: `M${s.x - 11},${s.y - 11} L${s.x + 11},${s.y + 11} M${s.x + 11},${s.y - 11} L${s.x - 11},${s.y + 11}`, stroke: '#b3121c', 'stroke-width': 5, 'stroke-linecap': 'round' });
    }
    const t = el('text', { x: s.x, y: s.y + 40, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 700, fill: '#5a3a1a', 'font-family': 'Caveat, cursive' });
    t.textContent = s.name;
  });

  // длины маршрута до каждой остановки
  routeLen = STOPS.map((_, i) => {
    if (i === 0) return 0;
    const tmp = el('path', { d: smoothPath(STOPS.slice(0, i + 1)), fill: 'none' });
    const L = tmp.getTotalLength(); tmp.remove(); return L;
  });
  routeTotal = routeLen[routeLen.length - 1];
  maskPath.setAttribute('stroke-dasharray', `${routeTotal} ${routeTotal + 10}`);

  ship = el('text', { 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 30 });
  ship.textContent = '⛵';
  setReveal(0);
}
function setReveal(L) {
  revealed = L;
  maskPath.setAttribute('stroke-dashoffset', routeTotal - L);
  const p = maskPath.getPointAtLength(Math.max(0, L));
  ship.setAttribute('x', p.x); ship.setAttribute('y', p.y - 14);
}
// покачивание кораблика
(function bob() {
  if (ship) ship.setAttribute('transform', `rotate(${Math.sin(performance.now() / 400) * 6} ${ship.getAttribute('x')} ${ship.getAttribute('y')})`);
  requestAnimationFrame(bob);
})();

async function setCard(i) {
  const c = $('card');
  c.classList.add('hide');
  await wait(450);
  c.querySelector('h3').textContent = STOPS[i].name;
  c.querySelector('p').textContent = STOPS[i].text;
  c.classList.remove('hide');
}

$('toMap').addEventListener('click', async () => {
  if (scene !== 2) return;
  scene = 3;
  setSkySafe('dawn');
  show(3);
  await wait(600);
  buildMap();
  stopIdx = 0;
  setCard(0);
  await wait(900);
  $('next').classList.add('show');
});

$('next').addEventListener('click', async () => {
  if (moving) return;
  if (stopIdx >= STOPS.length - 1) { toChest(); return; }
  moving = true;
  $('next').classList.remove('show');
  const from = routeLen[stopIdx], to = routeLen[stopIdx + 1], t0 = performance.now(), dur = 1900;
  await new Promise(res => {
    (function step() {
      const k = clamp((performance.now() - t0) / dur, 0, 1);
      setReveal(from + (to - from) * ease(k));
      k < 1 ? requestAnimationFrame(step) : res();
    })();
  });
  stopIdx++;
  await setCard(stopIdx);
  $('next').textContent = stopIdx === STOPS.length - 1 ? 'Копать здесь ⛏' : 'Плывём дальше ⛵';
  await wait(500);
  $('next').classList.add('show');
  moving = false;
});

// 3 → 4: сундук
function toChest() {
  if (scene !== 3) return;
  scene = 4;
  show(4);
}
let chestOpen = false;
$('chest').addEventListener('click', async () => {
  if (chestOpen) return;
  chestOpen = true;
  $('chestHint').style.opacity = 0;
  $('chest').classList.add('open');
  $('s4').classList.add('opened');
  await wait(350);
  coins();
  await wait(1300);
  $('treasureText').textContent = TREASURE; $('treasureText').classList.add('on');
  await wait(2200);
  $('question').textContent = QUESTION; $('question').classList.add('on');
  await wait(900);
  $('yes').classList.add('show'); $('no').classList.add('show');
});
function coins() {
  const r = $('chest').getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height * .4;
  const items = ['🪙', '🪙', '🪙', '💎', '💍', '🪙', '❤️'];
  for (let i = 0; i < 34; i++) {
    const s = document.createElement('span');
    s.className = 'coin'; s.textContent = items[(Math.random() * items.length) | 0];
    document.body.appendChild(s);
    let x = cx, y = cy, vx = rnd(-170, 170), vy = rnd(-560, -300), rot = rnd(0, 360), vr = rnd(-400, 400), t = 0;
    let lt = performance.now();
    (function fly(now) {
      const dt = Math.min((now - lt) / 1000, .033); lt = now; t += dt;
      vy += 900 * dt; x += vx * dt; y += vy * dt; rot += vr * dt;
      s.style.transform = `translate(${x - 13}px,${y - 13}px) rotate(${rot}deg)`;
      s.style.opacity = clamp(2.4 - t, 0, 1);
      if (t < 2.6) requestAnimationFrame(fly); else s.remove();
    })(lt);
  }
}

// кнопка «Нет» убегает
let noCount = 0;
function runAway(e) {
  e.preventDefault(); e.stopPropagation();
  const b = $('no');
  b.textContent = NO_TEXTS[noCount % NO_TEXTS.length]; noCount++;
  const r = b.getBoundingClientRect();
  const maxX = innerWidth - r.width - 16, maxY = innerHeight - r.height - 16;
  b.style.position = 'fixed';
  b.style.left = rnd(16, maxX) + 'px';
  b.style.top = rnd(innerHeight * .15, maxY) + 'px';
  b.style.zIndex = 10;
}
['pointerdown', 'mouseenter', 'click'].forEach(ev => $('no').addEventListener(ev, runAway));

// 4 → 5: финал
$('yes').addEventListener('click', async () => {
  if (scene === 5) return;
  scene = 5;
  $('no').style.display = 'none';
  setSkySafe('sunset');
  show(5);
  yachtOn = true; yachtT0 = performance.now();
  await wait(1200);
  finalOn = true;
  burst(W * .3, H * .25, 70); burst(W * .7, H * .2, 70);
  $('finalTitle').classList.add('on');
  await wait(1200);
  $('finalText').innerHTML = FINAL; $('finalText').classList.add('on');
});
</script>
