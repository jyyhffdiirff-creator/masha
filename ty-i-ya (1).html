<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ты и я</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;background:#07010f;overflow:hidden}
  body{height:100dvh;font-family:Georgia,"Times New Roman",serif}
  #scene{position:fixed;inset:0;width:100vw;height:100dvh}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;opacity:0;transition:opacity 1.6s ease}
  #names{color:#fff;font-size:clamp(15px,4.6vmin,40px);letter-spacing:.14em;text-shadow:0 0 14px rgba(255,120,220,.9),0 0 34px rgba(190,80,255,.6);white-space:nowrap}
  #names .amp{margin:0 .35em;color:#ffd2f4}
  #sub{margin-top:1.4em;color:rgba(255,235,250,.85);font-size:clamp(9px,2.3vmin,15px);letter-spacing:.32em;padding-left:.32em;text-shadow:0 0 10px rgba(255,120,220,.8)}
  #miss{margin-top:1.6em;color:rgba(255,225,248,.9);font-style:italic;font-size:clamp(11px,3vmin,17px);letter-spacing:.04em;max-width:52vmin;line-height:1.4;opacity:0;transition:opacity 1.6s ease 1.4s;text-shadow:0 0 10px rgba(255,120,220,.7)}
  #text[style*="opacity: 1"] #miss{opacity:1}
  #ecgLabel{position:absolute;left:0;top:0;color:rgba(230,200,255,.85);font-family:Arial,sans-serif;font-size:clamp(9px,2vmin,13px);letter-spacing:.12em;opacity:0;transition:opacity .8s;pointer-events:none;white-space:nowrap}
  #card{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:30px;background:rgba(40,10,60,.55);border:1px solid rgba(200,120,255,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-family:Georgia,serif;color:#e9c8ff;font-size:12px;transition:opacity .4s}
  #card input{width:78px;background:transparent;border:none;border-bottom:1px solid rgba(220,160,255,.45);color:#fff;font-family:inherit;font-size:12px;text-align:center;outline:none;padding:2px 0}
  #card.hide #box{display:none}
  #box{display:flex;align-items:center;gap:6px}
  #toggle{background:none;border:none;color:#f0b8ff;font-size:14px;cursor:pointer;padding:0 2px}
  #again{position:absolute;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 22px;border-radius:30px;border:1px solid rgba(220,140,255,.45);background:rgba(60,15,90,.45);color:#f6dcff;font-family:Georgia,serif;font-size:14px;letter-spacing:.08em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1s;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  #again.show{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<div id="scene">
  <canvas id="c"></canvas>
  <div id="ecgLabel">♥ КАЖДЫЙ УДАР — МЫСЛЬ О ТЕБЕ ♥</div>
  <div id="text">
    <div id="names"><span id="n1">ГЕОРГИЙ</span><span class="amp">&amp;</span><span id="n2">МАША</span></div>
    <div id="sub">ОЧЕНЬ ПО ТЕБЕ СКУЧАЮ</div>
    <div id="miss">Считаю дни до встречи. Скоро буду рядом 🤍</div>
  </div>
  <div id="card" class="hide">
    <button id="toggle" title="Имена">✎</button>
    <div id="box"><input id="i1" maxlength="12" value="Георгий"><span>&amp;</span><input id="i2" maxlength="12" value="Маша"></div>
  </div>
  <button id="again">↻ Ещё раз</button>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const textEl=document.getElementById('text'),label=document.getElementById('ecgLabel'),again=document.getElementById('again');
const n1=document.getElementById('n1'),n2=document.getElementById('n2'),i1=document.getElementById('i1'),i2=document.getElementById('i2');
let W=0,H=0,DPR=1,S=10,CX=0,CY=0;
const rnd=(a,b)=>a+Math.random()*(b-a);

function resize(){
  const r=document.getElementById('scene').getBoundingClientRect();
  const w=Math.round(r.width),h=Math.round(r.height);
  if(w===W&&h===H)return;
  W=w;H=h;DPR=Math.min(window.devicePixelRatio||1,2);
  c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  S=Math.min(W,H)/44;CX=W/2;CY=H/2;
  buildStars();
  if(parts.length)assignTargets();
}
// ---------- names ----------
try{const s=JSON.parse(localStorage.getItem('tyiya-names')||'null');if(s){i1.value=s[0];i2.value=s[1];}}catch(e){}
function syncNames(){
  n1.textContent=(i1.value.trim()||'Ты').toUpperCase();
  n2.textContent=(i2.value.trim()||'Я').toUpperCase();
  try{localStorage.setItem('tyiya-names',JSON.stringify([i1.value,i2.value]))}catch(e){}
}
i1.oninput=i2.oninput=syncNames;syncNames();
document.getElementById('toggle').onclick=()=>document.getElementById('card').classList.toggle('hide');

// ---------- stars ----------
let stars=[];
function buildStars(){
  stars=[];const n=Math.round(W*H/2600);
  for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:rnd(.3,1.4),a:rnd(.2,.9),p:rnd(0,6.28),s:rnd(.5,2)});
}
// ---------- heart ----------
const hx=t=>16*Math.pow(Math.sin(t),3);
const hy=t=>-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
// ---------- particles ----------
const N=Math.min(1400,Math.max(700,Math.round((innerWidth*innerHeight)/900)));
let parts=[];
function makeParts(){
  parts=[];
  for(let i=0;i<N;i++){
    parts.push({x:0,y:0,vx:0,vy:0,tx:0,ty:0,t:(i/N)*Math.PI*2,j:rnd(-1,1),
      r:rnd(.6,2.1),hue:rnd(285,335),ph:rnd(0,6.28),delay:rnd(0,.9)});
  }
  assignTargets();
}
function assignTargets(){
  for(const p of parts){
    const off=1+p.j*0.045;
    p.tx=CX+hx(p.t)*S*off; p.ty=CY+hy(p.t)*S*off-S*0.5;
  }
}
// ---------- petals ----------
let petals=[];
function spawnPetal(top){
  petals.push({x:rnd(0,W),y:top?rnd(-H*.2,-20):rnd(0,H),vy:rnd(18,45),vx:rnd(-12,12),
    rot:rnd(0,6.28),vr:rnd(-1.5,1.5),sz:rnd(5,11),sw:rnd(0,6.28),hue:rnd(300,335),a:rnd(.45,.85)});
}
function drawPetal(p){
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=p.a;
  const g=ctx.createLinearGradient(0,-p.sz,0,p.sz);
  g.addColorStop(0,`hsla(${p.hue},90%,78%,1)`);g.addColorStop(1,`hsla(${p.hue},85%,55%,.7)`);
  ctx.fillStyle=g;ctx.shadowColor=`hsla(${p.hue},100%,70%,.9)`;ctx.shadowBlur=10;
  ctx.beginPath();ctx.moveTo(0,-p.sz);
  ctx.bezierCurveTo(p.sz*.9,-p.sz*.6,p.sz*.7,p.sz*.7,0,p.sz);
  ctx.bezierCurveTo(-p.sz*.7,p.sz*.7,-p.sz*.9,-p.sz*.6,0,-p.sz);ctx.fill();ctx.restore();
}
// ---------- ECG ----------
const ECG_X0=()=>0, ECG_X1=()=>W*.66, ECG_Y=()=>CY;
function ecgShape(u){ // u 0..1 along the line -> vertical offset (px)
  const A=Math.min(W,H)*.2;
  const spike=(c,w,h)=>Math.exp(-Math.pow((u-c)/w,2))*h;
  return -spike(.44,.006,A*.25)+spike(.5,.012,-A*1.1)+spike(.53,.01,A*.9)-spike(.5,.006,0)+spike(.6,.025,-A*.12)+spike(.38,.02,-A*.08);
}
// ---------- timeline ----------
let t0=0,phase='ecg',lastT=0,textShown=false;
const T_ECG=3.2,T_BURST=0.9,T_FORM=3.2;
function start(){
  makeParts();t0=performance.now()/1000;phase='ecg';textShown=false;
  textEl.style.opacity=0;again.classList.remove('show');
  label.style.left=(W*.12)+'px';label.style.top=(CY-Math.min(W,H)*.27)+'px';label.style.opacity=1;
}
again.onclick=start;

function frame(now){
  now/=1000;const dt=Math.min(.05,now-(lastT||now));lastT=now;const T=now-t0;
  // bg
  ctx.globalCompositeOperation='source-over';
  const bg=ctx.createRadialGradient(CX,CY,0,CX,CY,Math.max(W,H)*.75);
  bg.addColorStop(0,'#1d0832');bg.addColorStop(.55,'#0d0320');bg.addColorStop(1,'#04010a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(const s of stars){const a=s.a*(.55+.45*Math.sin(now*s.s+s.p));ctx.fillStyle=`rgba(255,240,255,${a})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}

  // petals
  if(petals.length<26&&Math.random()<.08)spawnPetal(true);
  for(let i=petals.length-1;i>=0;i--){const p=petals[i];p.sw+=dt*1.6;p.x+=(p.vx+Math.sin(p.sw)*18)*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;drawPetal(p);if(p.y>H+30)petals.splice(i,1);}

  ctx.globalCompositeOperation='lighter';
  if(T<T_ECG){ // draw ECG line progressively
    const prog=Math.min(1,T/(T_ECG*.85));const x1=ECG_X1();
    ctx.lineWidth=2.4;ctx.lineJoin='round';ctx.lineCap='round';
    for(const pass of [{w:9,a:.18},{w:4,a:.45},{w:2,a:1}]){
      ctx.beginPath();ctx.lineWidth=pass.w;ctx.strokeStyle=`rgba(${pass.w>3?'200,90,255':'245,215,255'},${pass.a})`;
      const steps=Math.round(prog*500);
      for(let i=0;i<=steps;i++){const u=i/500;const x=u*x1,y=ECG_Y()+ecgShape(u);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
      ctx.stroke();
    }
    const hx0=prog*x1,hy0=ECG_Y()+ecgShape(prog);
    const g=ctx.createRadialGradient(hx0,hy0,0,hx0,hy0,22);g.addColorStop(0,'rgba(255,240,255,1)');g.addColorStop(1,'rgba(220,100,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(hx0,hy0,22,0,6.283);ctx.fill();
    if(T>T_ECG*.88){label.style.opacity=0;}
    if(T>=T_ECG-0.02&&phase==='ecg'){ // burst from ECG head
      phase='burst';
      for(const p of parts){const a=rnd(0,6.283),sp=rnd(80,Math.max(W,H)*.9);p.x=x1;p.y=ECG_Y();p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;}
    }
  } else {
    if(phase==='ecg'){phase='burst';for(const p of parts){const a=rnd(0,6.283),sp=rnd(80,Math.max(W,H)*.9);p.x=ECG_X1();p.y=ECG_Y();p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;}}
    const tb=T-T_ECG;
    // pulse (double beat) once formed
    const beatT=(T%1.3);const beat=1+.05*Math.exp(-Math.pow((beatT-.1)/.07,2))+.03*Math.exp(-Math.pow((beatT-.35)/.07,2));
    const formed=Math.min(1,Math.max(0,(tb-T_BURST)/T_FORM));
    // inner glow
    if(formed>0){
      const ga=formed*(.45+.15*(beat-1)*10);
      const g=ctx.createRadialGradient(CX,CY-S*1.5,0,CX,CY-S*1.5,S*15*beat);
      g.addColorStop(0,`rgba(200,60,200,${ga*.55})`);g.addColorStop(.6,`rgba(120,30,160,${ga*.25})`);g.addColorStop(1,'rgba(60,0,90,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(CX,CY-S*1.5,S*15*beat,0,6.283);ctx.fill();
    }
    for(const p of parts){
      if(tb<T_BURST){ // explosion with streaks
        p.vx*=Math.pow(.12,dt);p.vy*=Math.pow(.12,dt);
        const ox=p.x,oy=p.y;p.x+=p.vx*dt;p.y+=p.vy*dt;
        ctx.strokeStyle=`hsla(${p.hue},100%,75%,.55)`;ctx.lineWidth=p.r;
        ctx.beginPath();ctx.moveTo(ox-p.vx*.05,oy-p.vy*.05);ctx.lineTo(p.x,p.y);ctx.stroke();
      } else {
        const k=Math.max(0,Math.min(1,(tb-T_BURST-p.delay*.8)/ (T_FORM*.6)));
        const tx=CX+(p.tx-CX)*beat,ty=(CY-S*.5)+(p.ty-(CY-S*.5))*beat;
        const stiff=k*k*28;
        p.vx+=(tx-p.x)*stiff*dt;p.vy+=(ty-p.y)*stiff*dt;
        p.vx+=Math.sin(now*1.3+p.ph)*6*dt*(1-k);
        const damp=Math.pow(k>0?.02:.4,dt);p.vx*=damp;p.vy*=damp;
        p.x+=p.vx*dt;p.y+=p.vy*dt;
      }
      const tw=.65+.35*Math.sin(now*3+p.ph);
      const rr=p.r*(1+formed*.4)*tw;
      ctx.fillStyle=`hsla(${p.hue},100%,${66+formed*6}%,${.35+tw*.5})`;
      ctx.beginPath();ctx.arc(p.x,p.y,rr*2.4,0,6.283);ctx.globalAlpha=.25;ctx.fill();
      ctx.globalAlpha=1;ctx.beginPath();ctx.arc(p.x,p.y,rr,0,6.283);ctx.fill();
    }
    if(!textShown&&tb>T_BURST+T_FORM*.75){textShown=true;textEl.style.opacity=1;setTimeout(()=>again.classList.add('show'),1800);}
  }
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
resize();
for(let i=0;i<14;i++)spawnPetal(false);
window.addEventListener('resize',resize);
if(window.visualViewport)visualViewport.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(document.getElementById('scene'));
setInterval(resize,500);
start();requestAnimationFrame(frame);
</script>
</body>
</html>
